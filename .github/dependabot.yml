version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      maven:
        patterns:
          - "*"
    ignore:
      # Guice 7+ drops javax.servlet in favor of jakarta.servlet (see appengine.use.EE8 in appengine-web.xml)
      - dependency-name: "com.google.inject*"
        update-types: ["version-update:semver-major"]
